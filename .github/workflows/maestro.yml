name: Maestro CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  maestro-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Run Maestro tests in Docker (headless device)
      run: |
        docker run --rm \
          -v ${{ github.workspace }}:/work \
          -w /work \
          mobiledevinc/maestro \
          maestro test tests/ \
            --app apk/EriBank.apk \
            --format junit \
            --output artifacts/Reports/test-results.xml \
            --test-output-dir artifacts/screenshots

    - name: Install junit-viewer
      run: npm install -g junit-viewer

    - name: Generate HTML report
      run: |
        junit-viewer --results=artifacts/Reports/test-results.xml --save=artifacts/Reports/consolidated-report.html

    - name: Run PowerShell Enhanced Report Script
      shell: pwsh
      run: ./generate-enhanced-report.ps1

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: maestro-test-results
        path: artifacts/
