name: Maestro CI

on:
  push:
    branches:
      - main
  workflow_dispatch:


jobs:
  maestro-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout current repo (includes APK and flows)
      uses: actions/checkout@v6

    - name: Enable KVM
      run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Maestro
      run: |
        curl -Ls "https://get.maestro.mobile.dev" | bash
        echo "$HOME/.maestro/bin" >> $GITHUB_PATH

    - name: Install junit-viewer (for HTML report generation)
      run: npm install -g junit-viewer

    - name: Set up Android Emulator & Run Tests
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 28
        target: default
        arch: x86_64
        profile: pixel_5
        disable-animations: true
        emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
        script: |
          # Wait a few extra seconds to ensure adb is ready
          adb wait-for-device
          mkdir -p artifacts/Reports
          mkdir -p artifacts/screenshots
          adb install apk/EriBank.apk
          # Run all tests with proper screenshot handling
          maestro test tests/ --test-output-dir artifacts/screenshots --format junit --output artifacts/Reports/test-results.xml || true
          # Generate HTML report
          junit-viewer --results=artifacts/Reports/test-results.xml --save=artifacts/Reports/consolidated-report.html

    - name: Run PowerShell Enhanced Report Script
      shell: pwsh
      run: |
        ./generate-enhanced-report.ps1    

    - name: Upload Test Reports and Screenshots
      uses: actions/upload-artifact@v4
      with:
        name: maestro-test-results
        path: |
          artifacts/Reports/
          artifacts/screenshots/
